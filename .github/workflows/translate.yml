name: Auto Translate and Convert to DOCX

on:
  push:
    branches:
      - main
    paths:
      - 'TD-H9_manual_ru.md'
  workflow_dispatch: # Позволит безопасно перезапускать перевод вручную из вкладки Actions

permissions:
  contents: write

jobs:
  translate_and_convert:
    runs-on: ubuntu-latest
    steps:
      # 1. Скачиваем код репозитория
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Устанавливаем полностью офлайновую библиотеку перевода
      - name: Install Argos Translate
        run: |
          pip install argostranslate

      # 3. Скачиваем языковую модель RU -> EN и выполняем перевод локально
      - name: Auto Translate Markdown via Argos
        run: |
          python -c "
          import argostranslate.package
          import argostranslate.translate

          # Обновляем индекс пакетов и скачиваем модель с русского на английский
          argostranslate.package.update_package_index()
          available_packages = argostranslate.package.get_available_packages()
          package_to_install = next(
              filter(
                  lambda x: x.from_code == 'ru' and x.to_code == 'en',
                  available_packages
              )
          )
          argostranslate.package.install_from_path(package_to_install.download())

          # Считываем русский файл руководства
          with open('TD-H9_manual_ru.md', 'r', encoding='utf-8') as f:
              text = f.read()

          # Локально переводим весь текст
          translated_text = argostranslate.translate.translate(text, 'ru', 'en')

          # Записываем английскую версию руководства
          with open('TD-H9_manual_ru.en.md', 'w', encoding='utf-8') as f:
              f.write(translated_text)
          "

      # 4. Устанавливаем Pandoc для конвертации документов
      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      # 5. Конвертируем оба Markdown-файла в формат .docx
      - name: Convert Markdown to DOCX
        run: |
          pandoc TD-H9_manual_ru.md -o TD-H9_manual_ru.docx
          if [ -f "TD-H9_manual_ru.en.md" ]; then
            pandoc TD-H9_manual_ru.en.md -o TD-H9_manual_ru.en.docx
          fi

      # 6. Фиксируем изменения и отправляем файлы обратно в репозиторий
      - name: Commit and Push Changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Проверяем наличие файлов перед добавлением, чтобы избежать ошибок Git
          [ -f "TD-H9_manual_ru.en.md" ] && git add TD-H9_manual_ru.en.md
          [ -f "TD-H9_manual_ru.docx" ] && git add TD-H9_manual_ru.docx
          [ -f "TD-H9_manual_ru.en.docx" ] && git add TD-H9_manual_ru.en.docx
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: auto-translate via Argos and convert to docx" && git push)
