name: Auto Translate and Convert to DOCX

on:
  push:
    branches:
      - main
    paths:
      - 'TD-H9_manual_ru.md'
  workflow_dispatch:

jobs:
  translate_and_convert:
    runs-on: ubuntu-latest
    steps:
      # 1. Скачиваем код репозитория
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Устанавливаем Pandoc
      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      # 3. Настраиваем Python и утилиты
      - name: Set up Python and Dependencies
        run: |
          pip install google-genai

      # 4. Моментальный перевод ВСЕГО файла одним запросом через Gemini API
      - name: Full File Translate via Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat << 'EOF' > translate_md.py
          import os
          import time
          from google import genai

          api_key = os.environ.get("GEMINI_API_KEY")
          if not api_key:
              print("Критическая ошибка: Секрет GEMINI_API_KEY не задан в настройках GitHub!")
              exit(1)

          client = genai.Client(api_key=api_key)

          # Читаем весь русский файл целиком
          with open("TD-H9_manual_ru.md", "r", encoding="utf-8") as f:
              full_text = f.read()

          # Промпт, обучающий Gemini бережно относиться к синтаксису Markdown
          prompt = (
              "You are an expert technical translator. Translate the following user manual from Russian to English.\n\n"
              "STRICT RULES:\n"
              "1. Keep all Markdown formatting exactly as it is: do not touch table structures (| and ---), headers (#), lists, bold (**), or images (![]()).\n"
              "2. Do not translate or modify hyperlinks inside brackets like [text](url) - translate ONLY the text inside [ ], keep the URL intact.\n"
              "3. Absolutely DO NOT translate or modify anything inside code blocks (```...```). Leave them fully in Russian or technical code format.\n"
              "4. Maintain correct radio-engineering terminology (e.g., squelch, CTCSS/DCS, frequency, channels).\n"
              "5. Output ONLY the translated Markdown text. Do not add introductory words, explanations, or wrap the final response in additional code blocks."
          )

          print("Отправка всего файла .md в Gemini API (один запрос)...")

          max_retries = 3
          translated_text = ""

          for attempt in range(max_retries):
              try:
                  response = client.models.generate_content(
                      model='gemini-3.8-flash',
                      contents=[prompt, full_text]
                  )
                  translated_text = response.text.strip()
                  if translated_text:
                      break
              except Exception as e:
                  print(f"Попытка {attempt + 1} не удалась из-за перегрузки сервера. Ожидание...")
                  time.sleep(5)

          if not translated_text:
              print("Критическая ошибка: не удалось получить ответ от API.")
              exit(1)

          # Очистка на случай, если модель проигнорировала инструкцию и обернула вывод в ```markdown ... ```
          if translated_text.startswith("```markdown"):
              translated_text = translated_text[11:]
          if translated_text.endswith("```"):
              translated_text = translated_text[:-3]
          translated_text = translated_text.strip()

          # Записываем переведенный файл
          with open("TD-H9_manual_ru.en.md", "w", encoding="utf-8") as f:
              f.write(translated_text)

          print("Файл успешно переведен целиком за один проход!")
          EOF
          python translate_md.py

      # 5. Конвертируем оба файла в формат .docx
      - name: Convert Markdown to DOCX via Pandoc
        run: |
          pandoc TD-H9_manual_ru.md -o TD-H9_manual_ru.docx
          if [ -f "TD-H9_manual_ru.en.md" ]; then
            pandoc TD-H9_manual_ru.en.md -o TD-H9_manual_ru.en.docx
          fi

      # 6. Фиксируем изменения и отправляем файлы обратно в репозиторий
      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          
          [ -f "TD-H9_manual_ru.en.md" ] && git add TD-H9_manual_ru.en.md
          [ -f "TD-H9_manual_ru.docx" ] && git add TD-H9_manual_ru.docx
          [ -f "TD-H9_manual_ru.en.docx" ] && git add TD-H9_manual_ru.en.docx
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: instant single-request AI translate and docx convert" && git push)
