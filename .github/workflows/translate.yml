name: Auto Translate README

on:
  push:
    branches:
      - main
    paths:
      - 'TD-H9_manual_ru.md'

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Auto Translate Markdown
        uses: ikhsan3adi/markdown-translator@master
        with:
          LANG: en
          FILES: TD-H9_manual_ru.md

      - name: Rename translated file
        run: |
          # Экшен создает файл с суффиксом языка перед расширением (например, TD-H9_manual_ru.en.md)
          # Переименовываем его в нужный вам вид TD-H9_manual_en.md
          if [ -f "TD-H9_manual_ru.en.md" ]; then
            mv TD-H9_manual_ru.en.md TD-H9_manual_en.md
          fi

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add TD-H9_manual_en.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: auto-update translation" && git push)
