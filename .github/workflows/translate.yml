name: Auto Translate and Convert to DOCX

on:
  push:
    branches:
      - main
    paths:
      - 'TD-H9_manual_ru.md'
  workflow_dispatch:

jobs:
  translate_and_convert:
    runs-on: ubuntu-latest
    steps:
      # 1. Скачиваем код репозитория
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Устанавливаем Pandoc
      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      # 3. Настраиваем Python и ставим локальный ИИ-переводчик (PyTorch + Transformers)
      - name: Set up Python and Local AI
        run: |
          pip install torch transformers sentencepiece

      # 4. Локальный нейросетевой перевод (Совместим с Transformers v5, без лимитов и интернета)
      - name: Local AI Paragraph Translate
        run: |
          cat << 'EOF' > translate_md.py
          import re
          import sys
          import torch
          from transformers import AutoTokenizer, AutoModelForSeq2SeqLM

          print("Инициализация локальной нейросети перевода (Совместимо с v5)...")
          model_name = "Helsinki-NLP/opus-mt-ru-en"
          try:
              # Загружаем модель напрямую через классы Seq2Seq вместо удаленного pipeline task
              tokenizer = AutoTokenizer.from_pretrained(model_name)
              model = AutoModelForSeq2SeqLM.from_pretrained(model_name)
          except Exception as e:
              print(f"Ошибка загрузки модели: {e}")
              sys.exit(1)

          def translate_block(text_block):
              if not text_block.strip():
                  return text_block
              try:
                  # Прямой перевод тензорами локально на процессоре
                  inputs = tokenizer(text_block, return_tensors="pt", padding=True, truncation=True, max_length=512)
                  with torch.no_grad():
                      translated_tokens = model.generate(**inputs)
                  result = tokenizer.decode(translated_tokens[0], skip_special_tokens=True)
                  return result.strip()
              except Exception as e:
                  print(f"Пропущена строка из-за ошибки модели: {e}")
                  return text_block

          print("Чтение файла документа...")
          with open("TD-H9_manual_ru.md", "r", encoding="utf-8") as f:
              full_text = f.read()

          paragraphs = full_text.split("\n\n")
          translated_paragraphs = []
          in_code_block = False

          print(f"Начало перевода. Всего абзацев: {len(paragraphs)}")

          for idx, p in enumerate(paragraphs):
              if idx % 10 == 0 and idx > 0:
                  print(f"Обработано абзацев: {idx}/{len(paragraphs)}...")

              # Защита блоков кода
              if p.strip().startswith("```"):
                  code_markers = p.count("```")
                  if code_markers % 2 != 0:
                      in_code_block = not in_code_block
                  translated_paragraphs.append(p)
                  continue
                  
              if in_code_block:
                  if "```" in p:
                      in_code_block = False
                  translated_paragraphs.append(p)
                  continue

              # Защита таблиц
              if p.strip().startswith("|") or p.strip().startswith("---"):
                  lines = p.split("\n")
                  trans_lines = []
                  for line in lines:
                      if line.strip().startswith("|") or line.strip().startswith("---"):
                          parts = line.split("|")
                          new_parts = []
                          for part in parts:
                              if part.strip() and not set(part.strip()).issubset({'-', ':', ' '}):
                                  new_parts.append(f" {translate_block(part.strip())} ")
                              else:
                                  new_parts.append(part)
                          trans_lines.append("|".join(new_parts))
                      else:
                          trans_lines.append(translate_block(line))
                  translated_paragraphs.append("\n".join(trans_lines))
                  continue

              # Защита ссылок [текст](url)
              links = re.findall(r'(\[[^\]]+\]\([^)]+\))', p)
              if links:
                  link_map = {}
                  for l_idx, link in enumerate(links):
                      text_match = re.search(r'\[([^\]]+)\]', link)
                      url_match = re.search(r'\(([^)]+)\)', link)
                      if text_match and url_match:
                          placeholder = f"__LN_PH_{l_idx}__"
                          trans_link_text = translate_block(text_match.group(1))
                          link_map[placeholder] = f"[{trans_link_text}]({url_match.group(1)})"
                          p = p.replace(link, placeholder)
                  
                  p = translate_block(p)
                  for placeholder, full_link in link_map.items():
                      p = p.replace(placeholder, full_link)
                  translated_paragraphs.append(p)
                  continue

              # Обычный абзац текста
              translated_paragraphs.append(translate_block(p))

          with open("TD-H9_manual_ru.en.md", "w", encoding="utf-8") as f:
              f.write("\n\n".join(translated_paragraphs))

          print("Локальный перевод успешно завершен!")
          EOF
          python translate_md.py

      # 5. Конвертируем оба файла в формат .docx
      - name: Convert Markdown to DOCX via Pandoc
        run: |
          pandoc TD-H9_manual_ru.md -o TD-H9_manual_ru.docx
          if [ -f "TD-H9_manual_ru.en.md" ]; then
            pandoc TD-H9_manual_ru.en.md -o TD-H9_manual_ru.en.docx
          fi

      # 6. Фиксируем изменения и отправляем файлы обратно в репозиторий
      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          [ -f "TD-H9_manual_ru.en.md" ] && git add TD-H9_manual_ru.en.md
          [ -f "TD-H9_manual_ru.docx" ] && git add TD-H9_manual_ru.docx
          [ -f "TD-H9_manual_ru.en.docx" ] && git add TD-H9_manual_ru.en.docx
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: local AI v5 translate and docx convert" && git push)
