name: Auto Translate and Convert to DOCX

on:
  push:
    branches:
      - main
    paths:
      - 'TD-H9_manual_ru.md'
  workflow_dispatch: # Позволяет безопасно перезапускать перевод вручную из вкладки Actions

jobs:
  translate_and_convert:
    runs-on: ubuntu-latest
    steps:
      # 1. Скачиваем код репозитория
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Устанавливаем Pandoc для конвертации документов
      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      # 3. Настраиваем Python и устанавливаем библиотеку перевода
      - name: Set up Python and Translator
        run: |
          pip install deep-translator

      # 4. Почаночный перевод через Google (до 4000 символов на запрос, разметка защищена)
      - name: Safe Chunked Translate via Google
        run: |
          cat << 'EOF' > translate_md.py
          import re
          import time
          from deep_translator import GoogleTranslator

          def translate_chunk(text_chunk):
              if not text_chunk.strip():
                  return text_chunk
              try:
                  return GoogleTranslator(source='ru', target='en').translate(text_chunk)
              except Exception as e:
                  print(f"Ошибка при запросе к Google: {e}")
                  return text_chunk

          with open("TD-H9_manual_ru.md", "r", encoding="utf-8") as f:
              lines = f.readlines()

          in_code_block = False
          translatable_parts = []
          structure = []

          # Шаг 1: Разбираем структуру Markdown документа
          for line in lines:
              if line.strip().startswith("```"):
                  in_code_block = not in_code_block
                  structure.append(('keep', line))
                  continue
              if in_code_block:
                  structure.append(('keep', line))
                  continue

              if not line.strip():
                  structure.append(('keep', line))
                  continue

              if line.strip().startswith("|") or line.strip().startswith("---"):
                  parts = line.split("|")
                  cell_meta = []
                  for p_idx, part in enumerate(parts):
                      if part.strip() and not set(part.strip()).issubset({'-', ':', ' '}):
                          translatable_parts.append(part.strip())
                          cell_meta.append((p_idx, len(translatable_parts) - 1))
                  structure.append(('table', (parts, cell_meta)))
                  continue

              links = re.findall(r'(\[[^\]]+\]\([^)]+\))', line)
              if links:
                  link_meta = []
                  for l_idx, link in enumerate(links):
                      text_match = re.search(r'\[([^\]]+)\]', link)
                      url_match = re.search(r'\(([^)]+)\)', link)
                      if text_match and url_match:
                          trans_text = text_match.group(1)
                          translatable_parts.append(trans_text)
                          link_meta.append({
                              'placeholder': f"__LINK_PH_{l_idx}__",
                              'url': url_match.group(1),
                              'payload_idx': len(translatable_parts) - 1
                          })
                          line = line.replace(link, f"__LINK_PH_{l_idx}__")
                  
                  translatable_parts.append(line.rstrip('\n'))
                  structure.append(('link_line', (line.rstrip('\n'), link_meta, len(translatable_parts) - 1)))
                  continue

              translatable_parts.append(line.rstrip('\n'))
              structure.append(('text', len(translatable_parts) - 1))

          # Шаг 2: Распределяем элементы по чанкам, не превышая лимит Google в 5000 символов
          delimiter = " [br_ph] "
          chunks = []
          current_chunk = []
          current_length = 0

          for part in translatable_parts:
              part_len = len(part) + len(delimiter)
              if current_length + part_len > 4000:  # Безопасный порог в 4000 символов
                  chunks.append(current_chunk)
                  current_chunk = [part]
                  current_length = len(part)
              else:
                  current_chunk.append(part)
                  current_length += part_len
          if current_chunk:
              chunks.append(current_chunk)

          # Шаг 3: Переводим каждый чанк и склеиваем результаты обратно
          translated_parts = []
          print(f"Файл разделен на {len(chunks)} порций для обхода лимитов Google.")

          for c_idx, chunk in enumerate(chunks):
              print(f"Перевод порции {c_idx + 1}/{len(chunks)}...")
              megastring = delimiter.join(chunk)
              translated_megastring = translate_chunk(megastring)
              
              chunk_translated = translated_megastring.split(delimiter)
              
              # Корректируем возможные удаления пробелов парсером Google
              if len(chunk_translated) != len(chunk):
                  chunk_translated = re.split(r'\s*\[br_ph\]\s*', translated_megastring)

              # Резервный сценарий: если чанк развалился, переводим его элементы поштучно
              if len(chunk_translated) != len(chunk):
                  print(f"Предупреждение в порции {c_idx + 1}: расхождение структуры. Перевод элементов по одному...")
                  chunk_translated = []
                  for item in chunk:
                      chunk_translated.append(translate_chunk(item))
                      time.sleep(0.5)

              translated_parts.extend(chunk_translated)
              time.sleep(1.0) # Задержка между запросами во избежание блокировок

          # Шаг 4: Реконструкция файла
          final_lines = []
          for item_type, data in structure:
              if item_type == 'keep':
                  final_lines.append(data)
              elif item_type == 'text':
                  final_lines.append(translated_parts[data] + "\n")
              elif item_type == 'table':
                  parts, cell_meta = data
                  for p_idx, payload_idx in cell_meta:
                      parts[p_idx] = f" {translated_parts[payload_idx]} "
                  final_lines.append("|".join(parts))
              elif item_type == 'link_line':
                  line_template, link_meta, line_payload_idx = data
                  translated_line = translated_parts[line_payload_idx]
                  for lm in link_meta:
                      trans_link_text = translated_parts[lm['payload_idx']]
                      full_link = f"[{trans_link_text}]({lm['url']})"
                      translated_line = translated_line.replace(lm['placeholder'], full_link)
                  final_lines.append(translated_line + "\n")

          with open("TD-H9_manual_ru.en.md", "w", encoding="utf-8") as f:
              f.writelines(final_lines)
          print("Перевод с оригинальным качеством Google успешно завершен!")
          EOF
          python translate_md.py

      # 5. Конвертируем оба файла в формат .docx
      - name: Convert Markdown to DOCX via Pandoc
        run: |
          pandoc TD-H9_manual_ru.md -o TD-H9_manual_ru.docx
          if [ -f "TD-H9_manual_ru.en.md" ]; then
            pandoc TD-H9_manual_ru.en.md -o TD-H9_manual_ru.en.docx
          else
            echo "Английский MD-файл не найден, конвертация отменена"
          fi

      # 6. Фиксируем изменения и отправляем файлы обратно в репозиторий
      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          
          # Проверяем наличие файлов перед добавлением, чтобы избежать ошибок Git
          [ -f "TD-H9_manual_ru.en.md" ] && git add TD-H9_manual_ru.en.md
          [ -f "TD-H9_manual_ru.docx" ] && git add TD-H9_manual_ru.docx
          [ -f "TD-H9_manual_ru.en.docx" ] && git add TD-H9_manual_ru.en.docx
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: perfect chunked google translate and docx convert" && git push)
