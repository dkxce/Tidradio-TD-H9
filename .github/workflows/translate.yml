name: Auto Translate and Convert to DOCX

on:
  push:
    branches:
      - main
    paths:
      - 'TD-H9_manual_ru.md'
  workflow_dispatch:

jobs:
  translate_and_convert:
    runs-on: ubuntu-latest
    steps:
      # 1. Скачиваем код репозитория
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Устанавливаем Pandoc
      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      # 3. Настраиваем Python и утилиты
      - name: Set up Python and Dependencies
        run: |
          pip install google-genai

      # 4. Поглавный перевод через Gemini API (порции по ~10 тыс. символов для обхода ограничений)
      - name: Chunked Gemini AI Translate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat << 'EOF' > translate_md.py
          import os
          import time
          from google import genai

          api_key = os.environ.get("GEMINI_API_KEY")
          if not api_key:
              print("Критическая ошибка: Секрет GEMINI_API_KEY не задан в настройках GitHub!")
              exit(1)

          client = genai.Client(api_key=api_key)

          def translate_text_via_gemini(text_block):
              if not text_block.strip():
                  return text_block
              
              prompt = (
                  "You are an expert technical translator. Translate the following section of a user manual from Russian to English.\n\n"
                  "STRICT RULES:\n"
                  "1. Keep all Markdown formatting exactly as it is: do not touch table structures (| and ---), headers (#), lists, bold (**), or images (![]()).\n"
                  "2. Do not translate or modify hyperlinks inside brackets like [text](url) - translate ONLY the text inside [ ], keep the URL intact.\n"
                  "3. Absolutely DO NOT translate or modify anything inside code blocks (```...```). Leave them fully in Russian or technical code format.\n"
                  "4. Maintain correct radio-engineering terminology (e.g., squelch, CTCSS/DCS, frequency, channels).\n"
                  "5. Output ONLY the translated Markdown text. Do not add introductory words, explanations, or wrap the final response in additional code blocks."
              )
              
              max_retries = 5
              for attempt in range(max_retries):
                  try:
                      response = client.models.generate_content(
                          model='gemini-3.8-flash',
                          contents=[prompt, text_block]
                      )
                      res_text = response.text.strip()
                      # Очистка на случай, если ИИ обернул вывод в блоки кода
                      if res_text.startswith("```markdown"):
                          res_text = res_text[11:]
                      if res_text.endswith("```"):
                          res_text = res_text[:-3]
                      return res_text.strip()
                  except Exception as e:
                      delay = 5 * (attempt + 1)
                      print(f"Сервер занят (Попытка {attempt + 1}/{max_retries}). Ожидание {delay} сек... Ошибка: {e}")
                      time.sleep(delay)
              return text_block

          # Читаем исходный файл
          with open("TD-H9_manual_ru.md", "r", encoding="utf-8") as f:
              full_text = f.read()

          # Разумное деление текста на крупные блоки по заголовкам или абзацам (~12,000 символов)
          paragraphs = full_text.split("\n\n")
          chunks = []
          current_chunk = []
          current_length = 0

          for p in paragraphs:
              if current_length + len(p) > 12000:
                  chunks.append("\n\n".join(current_chunk))
                  current_chunk = [p]
                  current_length = len(p)
              else:
                  current_chunk.append(p)
                  current_length += len(p) + 2
          if current_chunk:
              chunks.append("\n\n".join(current_chunk))

          print(f"Документ разбит на {len(chunks)} крупных разделов.")
          translated_chunks = []

          for idx, chunk in enumerate(chunks):
              print(f"Перевод раздела {idx + 1}/{len(chunks)}...")
              translated_block = translate_text_via_gemini(chunk)
              translated_chunks.append(translated_block)
              # Безопасная пауза между запросами к бесплатному API
              time.sleep(5.0)

          # Склеиваем и сохраняем файл
          final_markdown = "\n\n".join(translated_chunks)
          with open("TD-H9_manual_ru.en.md", "w", encoding="utf-8") as f:
              f.write(final_markdown)

          print("Перевод всего документа успешно завершен!")
          EOF
          python translate_md.py

      # 5. Конвертируем оба файла в формат .docx
      - name: Convert Markdown to DOCX via Pandoc
        run: |
          pandoc TD-H9_manual_ru.md -o TD-H9_manual_ru.docx
          if [ -f "TD-H9_manual_ru.en.md" ]; then
            pandoc TD-H9_manual_ru.en.md -o TD-H9_manual_ru.en.docx
          fi

      # 6. Фиксируем изменения и отправляем файлы обратно в репозиторий
      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          
          [ -f "TD-H9_manual_ru.en.md" ] && git add TD-H9_manual_ru.en.md
          [ -f "TD-H9_manual_ru.docx" ] && git add TD-H9_manual_ru.docx
          [ -f "TD-H9_manual_ru.en.docx" ] && git add TD-H9_manual_ru.en.docx
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: safe chunked AI translate via Gemini 3.8 and docx convert" && git push)
