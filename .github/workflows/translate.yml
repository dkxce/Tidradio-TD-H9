name: Auto Translate and Convert to DOCX

on:
  push:
    branches:
      - main
    paths:
      - 'TD-H9_manual_ru.md'
  workflow_dispatch:

jobs:
  translate_and_convert:
    runs-on: ubuntu-latest
    steps:
      # 1. Скачиваем репозиторий
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Устанавливаем Pandoc
      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      # 3. Устанавливаем современную библиотеку перевода
      - name: Set up Python and Translator
        run: |
          pip install deep-translator

      # 4. Профессиональный перевод через Google (1 запрос на весь файл, разметка защищена)
      - name: Safe Megabatch Translate via Google
        run: |
          cat << 'EOF' > translate_md.py
          import re
          from deep_translator import GoogleTranslator

          def translate_large_block(text_to_translate):
              if not text_to_translate.strip():
                  return text_to_translate
              try:
                  # Переводим весь блок за один единственный сетевой запрос
                  return GoogleTranslator(source='ru', target='en').translate(text_to_translate)
              except Exception as e:
                  print(f"Ошибка при запросе к Google: {e}")
                  return text_to_translate

          with open("TD-H9_manual_ru.md", "r", encoding="utf-8") as f:
              lines = f.readlines()

          in_code_block = False
          translatable_parts = []
          structure = []

          # Шаг 1: Разбираем документ и отделяем то, что нужно переводить
          for line in lines:
              # Игнорируем блоки кода ```
              if line.strip().startswith("```"):
                  in_code_block = not in_code_block
                  structure.append(('keep', line))
                  continue
              if in_code_block:
                  structure.append(('keep', line))
                  continue

              # Игнорируем пустые строки
              if not line.strip():
                  structure.append(('keep', line))
                  continue

              # Разметка таблиц
              if line.strip().startswith("|") or line.strip().startswith("---"):
                  parts = line.split("|")
                  cell_meta = []
                  for p_idx, part in enumerate(parts):
                      if part.strip() and not set(part.strip()).issubset({'-', ':', ' '}):
                          translatable_parts.append(part.strip())
                          cell_meta.append((p_idx, len(translatable_parts) - 1))
                  structure.append(('table', (parts, cell_meta)))
                  continue

              # Разметка ссылок [текст](url)
              links = re.findall(r'(\[[^\]]+\]\([^)]+\))', line)
              if links:
                  link_meta = []
                  for l_idx, link in enumerate(links):
                      text_match = re.search(r'\[([^\]]+)\]', link)
                      url_match = re.search(r'\(([^)]+)\)', link)
                      if text_match and url_match:
                          trans_text = text_match.group(1)
                          translatable_parts.append(trans_text)
                          link_meta.append({
                              'placeholder': f"__LINK_PH_{l_idx}__",
                              'url': url_match.group(1),
                              'payload_idx': len(translatable_parts) - 1
                          })
                          line = line.replace(link, f"__LINK_PH_{l_idx}__")
                  
                  translatable_parts.append(line.rstrip('\n'))
                  structure.append(('link_line', (line.rstrip('\n'), link_meta, len(translatable_parts) - 1)))
                  continue

              # Обычная строка текста
              translatable_parts.append(line.rstrip('\n'))
              structure.append(('text', len(translatable_parts) - 1))

          # Шаг 2: Склеиваем весь переводимый текст в супер-строку через уникальный разделитель
          # Это заставит Google перевести всё за 1 запрос и спасет от блокировок
          delimiter = " [br_ph] "
          megastring = delimiter.join(translatable_parts)

          print(f"Отправка текста в Google Translate единым запросом...")
          translated_megastring = translate_large_block(megastring)
          
          # Разбираем переведенную супер-строку обратно в массив
          translated_parts = translated_megastring.split(delimiter)

          # Если Google случайно удалил пробелы вокруг разделителя, подстрахуемся:
          if len(translated_parts) != len(translatable_parts):
              translated_parts = re.split(r'\s*\[br_ph\]\s*', translated_megastring)

          # Если структуры всё равно разъехались, откатываемся на безопасный поштучный массив
          if len(translated_parts) != len(translatable_parts):
              print("Предупреждение: Разделители сместились. Перевод в безопасном режиме...")
              translated_parts = []
              for part in translatable_parts:
                  translated_parts.append(translate_large_block(part))

          # Шаг 3: Собираем файл обратно
          final_lines = []
          for item_type, data in structure:
              if item_type == 'keep':
                  final_lines.append(data)
              elif item_type == 'text':
                  final_lines.append(translated_parts[data] + "\n")
              elif item_type == 'table':
                  parts, cell_meta = data
                  for p_idx, payload_idx in cell_meta:
                      parts[p_idx] = f" {translated_parts[payload_idx]} "
                  final_lines.append("|".join(parts))
              elif item_type == 'link_line':
                  line_template, link_meta, line_payload_idx = data
                  translated_line = translated_parts[line_payload_idx]
                  for lm in link_meta:
                      trans_link_text = translated_parts[lm['payload_idx']]
                      full_link = f"[{trans_link_text}]({lm['url']})"
                      translated_line = translated_line.replace(lm['placeholder'], full_link)
                  final_lines.append(translated_line + "\n")

          with open("TD-H9_manual_ru.en.md", "w", encoding="utf-8") as f:
              f.writelines(final_lines)
          print("Перевод с оригинальным качеством Google завершен!")
          EOF
          python translate_md.py

      # 5. Конвертируем в формат .docx
      - name: Convert Markdown to DOCX via Pandoc
        run: |
          pandoc TD-H9_manual_ru.md -o TD-H9_manual_ru.docx
          if [ -f "TD-H9_manual_ru.en.md" ]; then
            pandoc TD-H9_manual_ru.en.md -o TD-H9_manual_ru.en.docx
          fi

      # 6. Делаем коммит изменений
      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          
          [ -f "TD-H9_manual_ru.en.md" ] && git add TD-H9_manual_ru.en.md
          [ -f "TD-H9_manual_ru.docx" ] && git add TD-H9_manual_ru.docx
          [ -f "TD-H9_manual_ru.en.docx" ] && git add TD-H9_manual_ru.en.docx
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: perfect google translate with save formatting" && git push)
