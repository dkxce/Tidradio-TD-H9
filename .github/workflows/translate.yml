name: Auto Translate and Convert to DOCX

on:
  push:
    branches:
      - main
    paths:
      - 'TD-H9_manual_ru.md'
  workflow_dispatch:

jobs:
  translate_and_convert:
    runs-on: ubuntu-latest
    steps:
      # 1. Скачиваем код репозитория
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Устанавливаем Pandoc
      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      # 3. Настраиваем Python и устанавливаем Argos Translate
      - name: Set up Python and Install Argos
        run: |
          pip install argostranslate
          
          # Скрипт скачивания языковой модели RU -> EN
          python -c "
          import argostranslate.package
          import argostranslate.translate

          print('Обновление индекса пакетов Argos...')
          argostranslate.package.update_package_index()
          
          available_packages = argostranslate.package.get_available_packages()
          package_to_install = next(
              filter(
                  lambda x: x.from_code == 'ru' and x.to_code == 'en', available_packages
              )
          )
          
          print(f'Скачивание и установка модели: {package_to_install}')
          argostranslate.package.install_from_path(package_to_install.download())
          print('Модель Argos успешно установлена!')
          "

      # 4. Безопасный перевод Markdown через Argos Translate (без зависаний и поломки структуры)
      - name: Safe Translate Markdown via Argos
        env:
          # Жесткое ограничение потоков для предотвращения дедлоков внутри контейнера
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          cat << 'EOF' > translate_md.py
          import re
          import sys
          import os
          from argostranslate import translate

          print("Инициализация переводчика Argos...")
          def translate_text(text):
              if not text.strip():
                  return text
              try:
                  return translate.translate(text, "ru", "en")
              except Exception as e:
                  print(f"Ошибка перевода строки: {e}")
                  return text

          print("Чтение файла документа...")
          with open("TD-H9_manual_ru.md", "r", encoding="utf-8") as f:
              full_text = f.read()

          paragraphs = full_text.split("\n\n")
          structure = []
          payloads = []
          in_code_block = False

          # Шаг 1: Разбираем сложную структуру разметки Markdown
          for p in paragraphs:
              if p.strip().startswith("```"):
                  code_markers = p.count("```")
                  if code_markers % 2 != 0:
                      in_code_block = not in_code_block
                  structure.append(('keep', p))
                  continue
              if in_code_block:
                  if "```" in p:
                      in_code_block = False
                  structure.append(('keep', p))
                  continue

              # Разбор таблиц (переводим ячейки, не трогая разделители '|')
              if p.strip().startswith("|") or p.strip().startswith("---"):
                  lines = p.split("\n")
                  table_meta = []
                  for line in lines:
                      if line.strip().startswith("|") or line.strip().startswith("---"):
                          parts = line.split("|")
                          line_meta = []
                          for part in parts:
                              if part.strip() and not set(part.strip()).issubset({'-', ':', ' '}):
                                  payloads.append(part.strip())
                                  line_meta.append(('trans', len(payloads) - 1))
                              else:
                                  line_meta.append(('keep', part))
                          table_meta.append(('row', line_meta))
                      else:
                          payloads.append(line)
                          table_meta.append(('text', len(payloads) - 1))
                  structure.append(('table', table_meta))
                  continue

              # Разбор ссылок [текст](url) (переводим только описание внутри [ ])
              links = re.findall(r'(\[[^\]]+\]\([^)]+\))', p)
              if links:
                  link_meta = []
                  for l_idx, link in enumerate(links):
                      text_match = re.search(r'\[([^\]]+)\]', link)
                      url_match = re.search(r'\(([^)]+)\)', link)
                      if text_match and url_match:
                          payloads.append(text_match.group(1))
                          link_meta.append({
                              'placeholder': f"__LN_PH_{l_idx}__",
                              'url': url_match.group(1),
                              'payload_idx': len(payloads) - 1
                          })
                          p = p.replace(link, f"__LN_PH_{l_idx}__")
                  
                  payloads.append(p)
                  structure.append(('link_line', (p, link_meta, len(payloads) - 1)))
                  continue

              # Обычный абзац текста
              payloads.append(p)
              structure.append(('text', len(payloads) - 1))

          print(f"Извлечено {len(payloads)} текстовых элементов. Начинаем перевод...")
          
          # Шаг 2: Поочередно переводим изолированный чистый текст
          translated_parts = []
          for idx, item in enumerate(payloads):
              translated_parts.append(translate_text(item))
              if (idx + 1) % 50 == 0 or (idx + 1) == len(payloads):
                  print(f"Прогресс перевода Argos: {idx + 1}/{len(payloads)}...")

          # Шаг 3: Собираем Markdown файл обратно
          print("Реконструкция структуры Markdown документа...")
          final_paragraphs = []
          for item_type, data in structure:
              if item_type == 'keep':
                  final_paragraphs.append(data)
              elif item_type == 'text':
                  final_paragraphs.append(translated_parts[data])
              elif item_type == 'table':
                  table_lines = []
                  for row_type, row_data in data:
                      if row_type == 'text':
                          table_lines.append(translated_parts[row_data])
                      elif row_type == 'row':
                          row_parts = []
                          for cell_type, cell_data in row_data:
                              if cell_type == 'trans':
                                  row_parts.append(f" {translated_parts[cell_data]} ")
                              else:
                                  row_parts.append(cell_data)
                          table_lines.append("|".join(row_parts))
                  table_lines_clean = [l for l in table_lines if l.strip()]
                  final_paragraphs.append("\n".join(table_lines_clean))
              elif item_type == 'link_line':
                  p_template, link_meta, line_payload_idx = data
                  translated_p = translated_parts[line_payload_idx]
                  for lm in link_meta:
                      trans_link_text = translated_parts[lm['payload_idx']]
                      full_link = f"[{trans_link_text}]({lm['url']})"
                      translated_p = translated_p.replace(lm['placeholder'], full_link)
                  final_paragraphs.append(translated_p)

          with open("TD-H9_manual_ru.en.md", "w", encoding="utf-8") as f:
              f.write("\n\n".join(final_paragraphs))

          print("Перевод и сборка успешно завершены!")
          EOF
          python translate_md.py

      # 5. Конвертируем оба файла в формат .docx via Pandoc
      - name: Convert Markdown to DOCX via Pandoc
        run: |
          pandoc TD-H9_manual_ru.md -o TD-H9_manual_ru.docx
          if [ -f "TD-H9_manual_ru.en.md" ]; then
            pandoc TD-H9_manual_ru.en.md -o TD-H9_manual_ru.en.docx
          fi

      # 6. Фиксируем изменения и отправляем файлы обратно в репозиторий
      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          
          [ -f "TD-H9_manual_ru.en.md" ] && git add TD-H9_manual_ru.en.md
          [ -f "TD-H9_manual_ru.docx" ] && git add TD-H9_manual_ru.docx
          [ -f "TD-H9_manual_ru.en.docx" ] && git add TD-H9_manual_ru.en.docx
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: crashproof local argos translate" && git push)
