name: Auto Translate Markdown

on:
  push:
    branches:
      - main
    paths:
      - 'TD-H9_manual.ru.md'
      - 'Docs/APRS_Digipeater_ru.md'
      - 'Docs/VSWR-antennas.md'
      - 'Docs/emission-types-radionerds-ru.md'
      - 'Customer Programming Software/Disasm/APRS_symbols.md'
      - 'Customer Programming Software/Disasm/README.md'
      - 'Customer Programming Software/Disasm/aprs.md'
      - 'Customer Programming Software/Disasm/gnss.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Translator
        uses: dkxce/md-auto-translator@main
        with:
          translate_paths: |
            TD-H9_manual.ru.md
            Docs/APRS_Digipeater_ru.md
            Docs/VSWR-antennas.md
            Docs/emission-types-radionerds-ru.md
            Customer Programming Software/Disasm/APRS_symbols.md
            Customer Programming Software/Disasm/README.md
            Customer Programming Software/Disasm/aprs.md
            Customer Programming Software/Disasm/gnss.md
          convert_paths: |
            TD-H9_manual.ru.md
            Docs/APRS_Digipeater_ru.md
            Docs/VSWR-antennas.md
            Docs/emission-types-radionerds-ru.md
            Customer Programming Software/Disasm/APRS_symbols.md
            Customer Programming Software/Disasm/README.md
            Customer Programming Software/Disasm/aprs.md
            Customer Programming Software/Disasm/gnss.md
