name: Auto Translate and Convert to DOCX

on:
  push:
    branches:
      - main
    paths:
      - 'TD-H9_manual_ru.md'
  workflow_dispatch:

jobs:
  translate_and_convert:
    runs-on: ubuntu-latest
    steps:
      # 1. Скачиваем код репозитория
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Устанавливаем Pandoc
      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      # 3. Настраиваем Python и ставим библиотеку Google GenAI
      - name: Set up Python and Dependencies
        run: |
          pip install google-genai

      # 4. Профессиональный перевод через Gemini API (сохраняет разметку, обходит блокировки IP)
      - name: Translate Markdown via Gemini API
        env:
          GEMINI_API_KEY: \${{ secrets.GEMINI_API_KEY }}
        run: |
          cat << 'EOF' > translate_md.py
          import os
          import re
          import time
          from google import genai
          from google.genai import types

          api_key = os.environ.get("GEMINI_API_KEY")
          if not api_key:
              print("Критическая ошибка: Секрет GEMINI_API_KEY не задан в настройках GitHub!")
              exit(1)

          client = genai.Client(api_key=api_key)

          def translate_chunk_via_gemini(text_chunk):
              if not text_chunk.strip():
                  return text_chunk
              
              prompt = (
                  "You are a professional technical translator. Translate the following text from Russian to English. "
                  "CRITICAL RULES:\n"
                  "1. Strictly keep the special delimiter ' [br_ph] ' exactly as it is, do not translate it, do not add or remove spaces around it.\n"
                  "2. Do not modify or translate placeholders like '__LINK_PH_0__'.\n"
                  "3. Maintain the technical meaning of radio equipment terms.\n"
                  "4. Output ONLY the translated text without any explanations or markdown formatting wrapping."
              )
              
              try:
                  # Использование быстрой и точной модели gemini-2.5-flash
                  response = client.models.generate_content(
                      model='gemini-2.5-flash',
                      contents=[prompt, text_chunk]
                  )
                  return response.text.strip()
              except Exception as e:
                  print(f"Ошибка при запросе к Gemini API: {e}")
                  return text_chunk

          with open("TD-H9_manual_ru.md", "r", encoding="utf-8") as f:
              lines = f.readlines()

          in_code_block = False
          translatable_parts = []
          structure = []

          # Разбор структуры Markdown
          for line in lines:
              if line.strip().startswith("```"):
                  in_code_block = not in_code_block
                  structure.append(('keep', line))
                  continue
              if in_code_block:
                  structure.append(('keep', line))
                  continue

              if not line.strip():
                  structure.append(('keep', line))
                  continue

              if line.strip().startswith("|") or line.strip().startswith("---"):
                  parts = line.split("|")
                  cell_meta = []
                  for p_idx, part in enumerate(parts):
                      if part.strip() and not set(part.strip()).issubset({'-', ':', ' '}):
                          translatable_parts.append(part.strip())
                          cell_meta.append((p_idx, len(translatable_parts) - 1))
                  structure.append(('table', (parts, cell_meta)))
                  continue

              links = re.findall(r'(\[[^\]]+\]\([^)]+\))', line)
              if links:
                  link_meta = []
                  for l_idx, link in enumerate(links):
                      text_match = re.search(r'\[([^\]]+)\]', link)
                      url_match = re.search(r'\(([^)]+)\)', link)
                      if text_match and url_match:
                          trans_text = text_match.group(1)
                          translatable_parts.append(trans_text)
                          link_meta.append({
                              'placeholder': f"__LINK_PH_{l_idx}__",
                              'url': url_match.group(1),
                              'payload_idx': len(translatable_parts) - 1
                          })
                          line = line.replace(link, f"__LINK_PH_{l_idx}__")
                  
                  translatable_parts.append(line.rstrip('\n'))
                  structure.append(('link_line', (line.rstrip('\n'), link_meta, len(translatable_parts) - 1)))
                  continue

              translatable_parts.append(line.rstrip('\n'))
              structure.append(('text', len(translatable_parts) - 1))

          # Деление на крупные порции (Gemini легко переваривает до 10000+ символов, берем по 6000)
          delimiter = " [br_ph] "
          chunks = []
          current_chunk = []
          current_length = 0

          for part in translatable_parts:
              part_len = len(part) + len(delimiter)
              if current_length + part_len > 6000:
                  chunks.append(current_chunk)
                  current_chunk = [part]
                  current_length = len(part)
              else:
                  current_chunk.append(part)
                  current_length += part_len
          if current_chunk:
              chunks.append(current_chunk)

          translated_parts = []
          print(f"Файл разделен на {len(chunks)} порций для перевода через Gemini API.")

          for c_idx, chunk in enumerate(chunks):
              print(f"Перевод порции {c_idx + 1}/{len(chunks)}...")
              megastring = delimiter.join(chunk)
              translated_megastring = translate_chunk_via_gemini(megastring)
              
              chunk_translated = translated_megastring.split(delimiter)
              
              if len(chunk_translated) != len(chunk):
                  chunk_translated = re.split(r'\s*\[br_ph\]\s*', translated_megastring)

              if len(chunk_translated) != len(chunk):
                  print(f"Предупреждение в порции {c_idx + 1}: рассинхронизация разделителей. Поштучный перевод...")
                  chunk_translated = []
                  for item in chunk:
                      chunk_translated.append(translate_chunk_via_gemini(item))
                      time.sleep(2.0)

              translated_parts.extend(chunk_translated)
              time.sleep(2.0) # Задержка во избежание RPM лимитов бесплатного тарифа

          # Реконструкция документа
          final_lines = []
          for item_type, data in structure:
              if item_type == 'keep':
                  final_lines.append(data)
              elif item_type == 'text':
                  try:
                      final_lines.append(translated_parts[data] + "\n")
                  except IndexError:
                      final_lines.append("\n")
              elif item_type == 'table':
                  parts, cell_meta = data
                  for p_idx, payload_idx in cell_meta:
                      try:
                          parts[p_idx] = f" {translated_parts[payload_idx]} "
                      except IndexError:
                          pass
                  final_lines.append("|".join(parts))
              elif item_type == 'link_line':
                  line_template, link_meta, line_payload_idx = data
                  try:
                      translated_line = translated_parts[line_payload_idx]
                      for lm in link_meta:
                          trans_link_text = translated_parts[lm['payload_idx']]
                          full_link = f"[{trans_link_text}]({lm['url']})"
                          translated_line = translated_line.replace(lm['placeholder'], full_link)
                      final_lines.append(translated_line + "\n")
                  except IndexError:
                      final_lines.append("\n")

          with open("TD-H9_manual_ru.en.md", "w", encoding="utf-8") as f:
              f.writelines(final_lines)
          print("Качественный перевод через Gemini API успешно завершен!")
          EOF
          python translate_md.py

      # 5. Конвертируем оба файла в формат .docx
      - name: Convert Markdown to DOCX via Pandoc
        run: |
          pandoc TD-H9_manual_ru.md -o TD-H9_manual_ru.docx
          if [ -f "TD-H9_manual_ru.en.md" ]; then
            pandoc TD-H9_manual_ru.en.md -o TD-H9_manual_ru.en.docx
          fi

      # 6. Фиксируем изменения и отправляем файлы обратно в репозиторий
      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          
          [ -f "TD-H9_manual_ru.en.md" ] && git add TD-H9_manual_ru.en.md
          [ -f "TD-H9_manual_ru.docx" ] && git add TD-H9_manual_ru.docx
          [ -f "TD-H9_manual_ru.en.docx" ] && git add TD-H9_manual_ru.en.docx
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: perfect AI translate via Gemini and docx convert" && git push)
