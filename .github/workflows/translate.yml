name: Auto Translate and Convert to DOCX

on:
  push:
    branches:
      - main
    paths:
      - 'TD-H9_manual_ru.md'
  workflow_dispatch:

jobs:
  translate_and_convert:
    runs-on: ubuntu-latest
    steps:
      # 1. Скачиваем код репозитория
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Устанавливаем Pandoc
      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      # 3. Настраиваем Python и устанавливаем необходимые библиотеки
      - name: Set up Python and Packages
        run: |
          pip install argostranslate beautifulsoup4 markdownify mistletoe transliterate markdown

      # 4. Скачиваем языковую модель Argos Translate (RU -> EN)
      - name: Install Argos Model
        run: |
          python -c "
          import argostranslate.package
          print('Обновление индекса пакетов Argos...')
          argostranslate.package.update_package_index()
          available_packages = argostranslate.package.get_available_packages()
          package_to_install = next(filter(lambda x: x.from_code == 'ru' and x.to_code == 'en', available_packages))
          print(f'Скачивание и установка модели: {package_to_install}')
          argostranslate.package.install_from_path(package_to_install.download())
          print('Модель Argos успешно установлена!')
          "

      # 5. Перевод массива файлов через HTML-дерево (BeautifulSoup)
      - name: HTML Tree Translate and Markdown Reconstruction
        env:
          # Жесткое ограничение потоков CTranslate2 во избежание зависания контейнера
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          cat << 'EOF' > translate_html_tree.py
          import os
          import re
          import sys
          import markdown
          from bs4 import BeautifulSoup, NavigableString
          from markdownify import markdownify as mdify
          from transliterate import slugify
          import argostranslate.translate

          # =========================================================================
          # МАССИВ ФАЙЛОВ ДЛЯ ОБРАБОТКИ
          # Сюда можно дописывать любые новые .md файлы для автоматического перевода
          # =========================================================================
          files_to_translate = [
              "TD-H9_manual_ru.md"
          ]

          def translate_text(text):
              """Безопасный локальный перевод строки через Argos"""
              clean_text = text.strip()
              if not clean_text or clean_text.isdigit() or len(clean_text) < 2:
                  return text
              try:
                  return argostranslate.translate.translate(clean_text, "ru", "en")
              except Exception:
                  return text

          def make_slug(text):
              """Создает безопасный латинский ID (slug) для заголовков"""
              slug = slugify(text.lower())
              if not slug:
                  slug = text.lower().replace(" ", "-")
              slug = re.sub(r'[^a-z0-9-_]', '', slug)
              return slug

          # Основной цикл обработки массива файлов
          for input_path in files_to_translate:
              if not os.path.exists(input_path):
                  print(f"Предупреждение: Файл {input_path} не найден, пропускаем.")
                  continue

              # Генерация имени выходного файла (заменяет _ru.md на _en.md или добавляет .en.md)
              if "_ru.md" in input_path:
                  output_path = input_path.replace("_ru.md", ".en.md")
              else:
                  output_path = input_path.replace(".md", ".en.md")

              print(f"\n Начинаем обработку файла: {input_path} -> {output_path}")
              
              # Карта для сопоставления старых русских якорей и новых латинских slug-якорей
              anchor_mapping = {}

              with open(input_path, "r", encoding="utf-8") as f:
                  md_content = f.read()

              # Конвертация в HTML дерево с поддержкой таблиц и блоков кода
              html_content = markdown.markdown(md_content, extensions=['tables', 'fenced_code'])
              soup = BeautifulSoup(html_content, "html.parser")

              print(f"[{input_path}] Шаг 1: Разбор заголовков и создание карты якорей...")
              for heading in soup.find_all(re.compile(r'^h[1-6]$')):
                  orig_text = heading.get_text()
                  orig_slug = orig_text.lower().replace(" ", "-")
                  orig_slug = re.sub(r'[^a-z0-9-_]', '', orig_slug)
                  
                  for string in heading.find_all(string=True):
                      if isinstance(string, NavigableString):
                          string.replace_with(translate_text(string))
                  
                  trans_text = heading.get_text()
                  new_slug = make_slug(trans_text)
                  anchor_mapping[f"#{orig_slug}"] = f"#{new_slug}"
                  
                  anchor_tag = soup.new_tag("a", attrs={"name": new_slug})
                  heading.append(anchor_tag)

              print(f"[{input_path}] Шаг 2: Перевод контента, таблиц и обновление внутренних ссылок...")
              for tag in soup.find_all(True):
                  if tag.name in ['code', 'pre']:
                      continue  # Изолируем код
                  
                  if tag.name == 'a' and tag.has_attr('href'):
                      href = tag['href'].lower()
                      if href.startswith('#') and href in anchor_mapping:
                          tag['href'] = anchor_mapping[href]

                  for child in tag.children:
                      if isinstance(child, NavigableString) and child.strip():
                          if tag.name not in ['code', 'pre'] and child.parent.name not in ['code', 'pre']:
                              child.replace_with(translate_text(child))

              print(f"[{input_path}] Шаг 3: Конвертация HTML обратно в Markdown...")
              translated_html = str(soup)
              translated_md = mdify(
                  translated_html,
                  heading_style="ATX",
                  strip=['script', 'style']
              )
              translated_md = re.sub(r'\n{3,}', '\n\n', translated_md)

              with open(output_path, "w", encoding="utf-8") as f:
                  f.write(translated_md)

              print(f"Успешно завершен перевод файла: {output_path}")

          print("\nВсе файлы из массива успешно обработаны!")
          EOF
          python translate_html_tree.py

      # 6. Динамическая конвертация всех Markdown-файлов в DOCX через Pandoc
      - name: Convert Markdown to DOCX via Pandoc
        run: |
          # Конвертируем все русские файлы разметки, которые есть в репозитории
          for f in *manual_ru.md; do
            if [ -f "$f" ]; then
              pandoc "$f" -o "${f%.md}.docx"
            fi
          done
          
          # Конвертируем все созданные английские переводы
          for f in *.en.md; do
            if [ -f "$f" ]; then
              pandoc "$f" -o "${f%.md}.docx"
            fi
          done

      # 7. Фиксируем изменения и отправляем файлы обратно в репозиторий
      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          
          # Индексируем любые измененные или новые .md и .docx файлы
          git add *.en.md *.docx 2>/dev/null || true
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: array-based html translate with working anchors" && git push)
