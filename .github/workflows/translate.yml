name: Auto Translate and Convert to DOCX

on:
  push:
    branches:
      - main
    paths:
      - 'TD-H9_manual_ru.md'
  workflow_dispatch:

jobs:
  translate_and_convert:
    runs-on: ubuntu-latest
    steps:
      # 1. Скачиваем репозиторий
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Устанавливаем системные пакеты (Pandoc)
      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      # 3. Настраиваем Python и переводчик
      - name: Set up Python
        run: |
          pip install deep-translator

      # 4. Умный перевод через Python (сохраняет таблицы, ссылки и блоки кода)
      - name: Safe Translate Markdown via Python
        run: |
          cat << 'EOF' > translate_md.py
          import re
          from deep_translator import GoogleTranslator

          def translate_text(text):
              if not text.strip():
                  return text
              try:
                  return GoogleTranslator(source='ru', target='en').translate(text)
              except Exception as e:
                  print(f"Ошибка перевода строки: {e}")
                  return text

          with open("TD-H9_manual_ru.md", "r", encoding="utf-8") as f:
              lines = f.readlines()

          translated_lines = []
          in_code_block = False

          for line in lines:
              if line.strip().startswith("```"):
                  in_code_block = not in_code_block
                  translated_lines.append(line)
                  continue
              
              if in_code_block:
                  translated_lines.append(line)
                  continue

              if line.strip().startswith("|") or line.strip().startswith("---"):
                  parts = line.split("|")
                  new_parts = []
                  for part in parts:
                      if part.strip() and not set(part.strip()).issubset({'-', ':', ' '}):
                          new_parts.append(f" {translate_text(part.strip())} ")
                      else:
                          new_parts.append(part)
                  translated_lines.append("|".join(new_parts))
                  continue

              links = re.findall(r'(\[[^\]]+\]\([^)]+\))', line)
              if links:
                  for i, link in enumerate(links):
                      line = line.replace(link, f"__LINK_PLACEHOLDER_{i}__")
                  
                  line = translate_text(line)
                  
                  for i, link in enumerate(links):
                      text_match = re.search(r'\[([^\]]+)\]', link)
                      url_match = re.search(r'\(([^)]+)\)', link)
                      if text_match and url_match:
                          translated_link_text = translate_text(text_match.group(1))
                          full_link = f"[{translated_link_text}]({url_match.group(1)})"
                          line = line.replace(f"__LINK_PLACEHOLDER_{i}__", full_link)
                  translated_lines.append(line + "\n")
              else:
                  translated_lines.append(translate_text(line) + "\n")

          with open("TD-H9_manual_ru.en.md", "w", encoding="utf-8") as f:
              f.writelines(translated_lines)
          EOF
          python translate_md.py

      # 5. Конвертируем оба Markdown-файла в формат .docx
      - name: Convert Markdown to DOCX via Pandoc
        run: |
          # Конвертируем русский оригинал
          pandoc TD-H9_manual_ru.md -o TD-H9_manual_ru.docx
          
          # Проверяем, создался ли английский перевод, и конвертируем его
          if [ -f "TD-H9_manual_ru.en.md" ]; then
            pandoc TD-H9_manual_ru.en.md -o TD-H9_manual_ru.en.docx
          else
            echo "Английский MD-файл не найден, конвертация отменена"
          fi

      # 6. Фиксируем изменения в репозитории
      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          
          [ -f "TD-H9_manual_ru.en.md" ] && git add TD-H9_manual_ru.en.md
          [ -f "TD-H9_manual_ru.docx" ] && git add TD-H9_manual_ru.docx
          [ -f "TD-H9_manual_ru.en.docx" ] && git add TD-H9_manual_ru.en.docx
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: auto-translate and convert to docx" && git push)
